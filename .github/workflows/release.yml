# Builds the Windows installer on GitHub's machines and attaches it to a Release.
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release notes are the version's commit message (what changed), then the download steps.
      # The app's "What's new" shows the part above "## Download".
      - run: |
          git log -1 --format=%B | grep -v '^Co-Authored-By' > notes.md
          cat >> notes.md <<'EOF'

          ## Download

          **Windows 10 / 11:** download `LinkCharts-Setup-….exe` below and open it.
          If Windows shows "Windows protected your PC", click **More info → Run anyway**.

          Already have LinkCharts 1.2 or newer? It updates itself (⚙ › App updates).
          Mac and Linux: see the [README](https://github.com/Mehal45/LinkCharts#installation).
          EOF
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          body_path: notes.md
